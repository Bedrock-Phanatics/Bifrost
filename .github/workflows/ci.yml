name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig build.zig.zon src tests examples

  test:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # Restored Windows caches can reference missing Zig runtime libraries
          use-cache: ${{ runner.os != 'Windows' }}
      - if: runner.os == 'Linux'
        run: sh tools/setup-native.sh
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tools/setup-native.ps1
      - run: zig build test bench-test
      - run: zig build test bench-test -Doptimize=ReleaseSafe
      - run: zig build test bench-test -Doptimize=ReleaseFast
      - if: runner.os == 'Linux'
        run: zig build fuzz-test --fuzz=1M

  stress:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # Restored Windows caches can reference missing Zig runtime libraries
          use-cache: ${{ runner.os != 'Windows' }}
      - if: runner.os == 'Linux'
        run: sh tools/setup-native.sh
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tools/setup-native.ps1
      - run: zig build stress -Doptimize=ReleaseSafe -Dtransfer-report=true
      - run: zig build stress -Doptimize=ReleaseSafe
      - run: zig build stress -Doptimize=ReleaseSafe

  bench-cli:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - run: sh tools/setup-native.sh
      - run: zig build bench -- --help
