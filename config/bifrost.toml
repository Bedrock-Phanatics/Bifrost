[server]
# HTTP signaling for NetherNet, TCP. The game's "Add Server" points here
bind = "0.0.0.0:19132"
# Prometheus metrics at http://<address>/metrics, off unless set
# metrics = "127.0.0.1:9100"
workers = 1
# Shown in the server list
motd = "Bifrost"
max_players = 4096
# 0 turns it off
max_players_per_ip = 0

[nethernet]
# Players confirm this key the first time they join, so keep the file across restarts
identity_file = "bifrost-identity.der"
# libdatachannel threads that run every connection's ICE, DTLS and SCTP; 0 picks one per core, up to 4
threads = 0
# UDP ports for player and backend connections; open them in the firewall. Unset means any port
# port_min = 50000
# port_max = 51000
# Address to gather candidates on, every interface when unset
# ice_bind = "203.0.113.10"
# Needed when players reach the proxy through NAT, e.g. ["stun:stun.l.google.com:19302"]
ice_servers = []
# One shared UDP socket instead of one per connection. Faster on Linux, slower on Windows, and not yet
# tried with vanilla clients
udp_mux = false
# Handshakes in flight at once, and per address so one IP can't take them all
max_negotiations = 32
max_negotiations_per_ip = 4

[limits]
connect_timeout_ms = 5000
pending_packets = 64
pending_bytes = 1048576
# Shared by every player and worker, see docs/limits.md
total_pending_bytes = 268435456
login_timeout_ms = 30000
resource_pack_timeout_ms = 600000
join_timeout_ms = 120000
# How long a player may leave the proxy unable to send to them before it gives up
slow_player_timeout_ms = 5000
# Per worker; extra logins are told the server is busy before any signature is checked
logins_per_second = 100
# Decompressed bytes a player may send, with a burst of 4x (at least 4 MiB)
player_bytes_per_second = 8388608
# Plugin callbacks slower than this get a warning, at most every 10 s per plugin
slow_plugin_callback_ms = 5
plugin_task_threads = 4

[health]
interval_ms = 5000
timeout_ms = 1000

[auth]
# NetherNet has no Minecraft encryption, so "verify" is what stops a captured login being replayed. It
# needs Microsoft's keys: https://authorization.franchise.minecraft-services.net/.well-known/keys
mode = "off"
# keys_file = "minecraft-keys.json"

[session]
# "managed" needs auth mode = "verify", and backends must trust the proxy key it logs. It is the setup to use
# in production, see docs/setup.md
mode = "passthrough"
# proxy_key_file = "bifrost-proxy.key"

[transfer]
phase_timeout_ms = 5000
timeout_ms = 15000
# Per worker
max_concurrent = 64
# "initial" keeps the first backend's packs for the whole session; "match" also needs every target to offer the same
content = "initial"

[[backend]]
# Defaults to the address. Backends speak NetherNet too, this is their HTTP signaling address
name = "lobby"
address = "127.0.0.1:19133"

[[backend]]
name = "survival"
address = "127.0.0.1:19134"

[plugins]
# Compiled libraries with embedded plugin.toml metadata, see docs/plugins.md
directory = "plugins"
# Library filename stems to skip
# disabled = ["Maintenance"]
