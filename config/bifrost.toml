[server]
bind = "0.0.0.0:19132"
# Prometheus metrics at http://<address>/metrics, off unless set
# metrics = "127.0.0.1:9100"
# Linux only above 1
workers = 1
motd = "MCPE;Bifrost;2193;1.26.51;0;100;0;Bifrost;Survival;1;19132;19133;"
max_players = 4096
# 0 turns it off
max_players_per_ip = 0

[limits]
connect_timeout_ms = 5000
pending_packets = 64
pending_bytes = 1048576
# Shared by every player and worker, see docs/limits.md
total_pending_bytes = 268435456
login_timeout_ms = 30000
resource_pack_timeout_ms = 600000
join_timeout_ms = 120000
# How long a player may leave the proxy unable to send to them before it gives up
slow_player_timeout_ms = 5000
# Per worker; extra logins are told the server is busy before any signature is checked
logins_per_second = 100
# Decompressed bytes a player may send, with a burst of 4x (at least 4 MiB)
player_bytes_per_second = 8388608
# Plugin callbacks slower than this get a warning, at most every 10 s per plugin
slow_plugin_callback_ms = 5
plugin_task_threads = 4
# Handshake traffic per IP, in RakNet tokens a second (one per 64 bytes); lower it if floods are a concern
handshake_rate_per_ip = 2000

[health]
interval_ms = 5000
timeout_ms = 1000

[auth]
# verify needs Microsoft's keys:
# https://authorization.franchise.minecraft-services.net/.well-known/keys
mode = "off"
# keys_file = "minecraft-keys.json"

[session]
# "managed" needs auth mode = "verify", and backends must trust the proxy key it logs
mode = "passthrough"
# proxy_key_file = "bifrost-proxy.key"

[transfer]
phase_timeout_ms = 5000
timeout_ms = 15000
# Per worker
max_concurrent = 64
# "initial" keeps the first backend's packs for the whole session; "match" also needs every target to offer the same
content = "initial"

[[backend]]
# Defaults to the address
name = "lobby"
address = "127.0.0.1:19133"

[[backend]]
name = "survival"
address = "127.0.0.1:19134"

[plugins]
# Compiled libraries with embedded plugin.toml metadata, see docs/plugins.md
directory = "plugins"
# Library filename stems to skip
# disabled = ["Maintenance"]
